# =============================================================================
# FlowForge AI — Local Development Infrastructure
# =============================================================================
# Provides PostgreSQL and Redis for local development.
# Used by start.sh — credentials match the auto-populated .env.local defaults.
#
# Usage:
#   docker compose up -d        # start services
#   docker compose stop         # stop (preserves data)
#   docker compose down -v      # stop + wipe all data
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge_dev_password
      POSTGRES_DB: flowforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge -d flowforge"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: flowforge_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - flowforge_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  flowforge_postgres_data:
    driver: local
  flowforge_redis_data:
    driver: local
